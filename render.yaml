# Render deployment config for SENTINEL FastAPI backend
services:
  - type: web
    name: sentinel-api
    runtime: python
    buildCommand: pip install -e ".[torch]"
    startCommand: uvicorn sentinel.serving.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SENTINEL_DATA_DIR
        value: /opt/render/project/src/data
      - key: SENTINEL_ARTIFACTS_DIR
        value: /opt/render/project/src/artifacts
    healthCheckPath: /api/health
